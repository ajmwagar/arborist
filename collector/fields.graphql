# Every field arborist cannot infer, in one place, for one repository.
#
# A fragment rather than a copy in each query: the fleet query fetches a page of
# these and the single-repository query fetches one, and two field lists that
# have to stay in step are two field lists that eventually do not. `collect.sh`
# prepends this file to whichever query it sends.
#
# The README is fetched whole and thrown away. Ingest keeps its size and the
# badge URLs it embeds, because a badge that points at a deleted workflow is the
# most common way a README starts lying — and the check that catches it needs
# four URLs, not four kilobytes.
fragment RepoFields on Repository {
  name
  isArchived
  isFork
  isPrivate
  pushedAt
  description
  licenseInfo {
    spdxId
  }
  defaultBranchRef {
    name
  }
  releases {
    totalCount
  }
  pullRequests(states: OPEN) {
    totalCount
  }
  branches: refs(refPrefix: "refs/heads/", first: 1) {
    totalCount
  }
  # The branches, not just how many. A count cannot say whether a branch has a
  # pull request or is finished with, and those are the two questions worth
  # asking: a branch nobody opened a PR for is work nobody can review.
  #
  # Twenty, newest first: a repository with seventy branches is a repository
  # with a branch problem the count above already reports, and fetching all
  # seventy would make the page expensive to answer a question the first twenty
  # have already answered. The check says how many it looked at.
  branchList: refs(
    refPrefix: "refs/heads/"
    first: 20
    orderBy: { field: TAG_COMMIT_DATE, direction: DESC }
  ) {
    nodes {
      name
      target {
        ... on Commit {
          committedDate
        }
      }
      associatedPullRequests(first: 3) {
        nodes {
          state
        }
      }
    }
  }
  workflows: object(expression: "HEAD:.github/workflows") {
    ... on Tree {
      entries {
        name
      }
    }
  }
  readme: object(expression: "HEAD:README.md") {
    ... on Blob {
      byteSize
      text
    }
  }
  # The instruction files are read for the words they use, not their prose: the
  # tracker check needs to know whether a file still says `bd`, and keeping the
  # text would make a snapshot megabytes wide to answer one question.
  agents: object(expression: "HEAD:AGENTS.md") {
    ... on Blob {
      text
    }
  }
  claude: object(expression: "HEAD:CLAUDE.md") {
    ... on Blob {
      text
    }
  }
  # The dependency manifests, read for the names they contain: a service that
  # depends on `axum` listens, one that depends on `prometheus` can be scraped.
  # Four ecosystems, because the question is the same in all of them.
  cargoToml: object(expression: "HEAD:Cargo.toml") {
    ... on Blob {
      text
    }
  }
  goMod: object(expression: "HEAD:go.mod") {
    ... on Blob {
      text
    }
  }
  packageJson: object(expression: "HEAD:package.json") {
    ... on Blob {
      text
    }
  }
  pyprojectToml: object(expression: "HEAD:pyproject.toml") {
    ... on Blob {
      text
    }
  }
  # Where the fleet keeps alert rules. A short list: `arborist template alerts`
  # writes the first one, so the file a remedy names is a file this reads.
  alertsRoot: object(expression: "HEAD:alerts.yml") {
    ... on Blob {
      text
    }
  }
  alertsPrometheus: object(expression: "HEAD:prometheus/alerts.yml") {
    ... on Blob {
      text
    }
  }
  alertsDeploy: object(expression: "HEAD:deploy/prometheus/alerts.yml") {
    ... on Blob {
      text
    }
  }
  alertsMonitoring: object(expression: "HEAD:monitoring/alerts.yml") {
    ... on Blob {
      text
    }
  }
}
