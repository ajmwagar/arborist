# The tool that audits CI has CI, and it is the gate the tool itself asks for:
# format, lint, test, and a real build of the component that ships.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --features cli --all-targets -- -D warnings
      - name: test
        run: cargo test --features cli

  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip2
      - name: the component builds for the target it ships as
        run: cargo build --release --target wasm32-wasip2 --features cli --bin arborist
      # Not a byte comparison. wasm is not reproducible across build hosts — the
      # path to the crate lands in the module — so a "the committed bytes match
      # a fresh build" gate would fail on every platform but the one that built
      # it, which is a false alarm dressed as a guarantee. What can be checked
      # anywhere is that what ships is a component: `\0asm` and the component
      # version, rather than a stale core module or a truncated copy.
      - name: the shipped module is a component
        # Python rather than `od | tr | grep`: the header is eight bytes, and
        # sed/od/grep formatting differs enough between macOS and the runner that
        # the pipeline is a portability test dressed as a wasm check.
        run: |
          python3 - <<'PY'
          import pathlib, sys
          expected = b"\x00asm\x0d\x00\x01\x00"
          head = pathlib.Path("bin/arborist.wasm").read_bytes()[:8]
          if head != expected:
              sys.exit(f"bin/arborist.wasm is not a wasm component: {head!r}")
          print("bin/arborist.wasm is a component")
          PY
