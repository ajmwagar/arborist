# arborist: the fleet's source repositories, scored against a written-down policy.
#
# The manifest is where the boundary is written down instead of hidden. arborist
# collects nothing and fetches nothing: a snapshot arrives on stdin and a report
# leaves on stdout. That is not a limitation to be fixed later, it is the reason
# the same bytes run in a shell inside soil-command, in a GitHub Action, and on
# a laptop whose only credential is the caller's own.

schema = 1

[spore]
id = "dev.fungos.arborist"
name = "arborist"
version = "0.2.0"
license = "MIT"
summary = "What every repository in the fleet is missing, and what has rotted"
description = "Reads a fleet snapshot and answers: which repositories have no licence, no CI, no release, no description, no documentation whose links still resolve, and which are drifting. The checks are one vocabulary and the thresholds are one policy, so the shell command, CI, and a view all see the same answer."
homepage = "https://github.com/ajmwagar/arborist"

[docs]
usage = [
  "gh api graphql --paginate ... | arborist ingest > snapshot.json",
  "arborist report < snapshot.json",
  "arborist explain OWNER/NAME < snapshot.json",
  "arborist checks",
  "arborist template readme",
]
man = "docs/man.md"

[catalog]
categories = ["developer-tools"]
keywords = ["ci", "licence", "audit", "fleet", "repositories", "bitrot"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
# No host ABI. The package imports WASI and nothing else, which is why a runner
# that links no soil:* capability at all can still run it.
abi = {}

[module]
path = "bin/arborist.wasm"

# A CLI: the host runs it with arguments and prints the result.
[launch]
default = "native"
surfaces = ["native"]

# The command-line face. Declaring it here is what puts `arborist` on a shell's
# PATH: the package carries the module, and every host that reads the install
# tree finds it. There is no second package to install.
[[commands]]
name = "arborist"
summary = "score a fleet snapshot and say what is missing"
module = "bin/arborist.wasm"

[denied]
# A check that could fetch would be a check whose answer depends on the network
# at the moment somebody asks. Evidence is collected once, by something that
# holds a token; scoring it is a pure function, and that is what makes two runs
# comparable.
"soil:http" = ["the snapshot is collected elsewhere; scoring never fetches"]
"soil:records" = ["v1 reads stdin, which needs no host capability"]
"soil:vfs" = ["the snapshot arrives on stdin, not at a path"]
transport = ["socket", "quic", "iroh", "ssh"]
host = ["process", "secrets", "environment", "raw-filesystem"]

[presentation]
badge = "Ar"
color = "#a3be8c"
mark = "assets/icon.svg"
