[package]
name = "arborist-view"
description = "The fleet wall: arborist's report, drawn by GPUI inside a Spore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ajmwagar/arborist"
publish = false

# A Spore is its own workspace: it pins the GPUI fork the wasip2 branch was
# built against, and the host's copy is not the one it compiles to.
#
# `wall/` is a separate workspace on purpose — it is the library both hosts
# build, and neither host's target belongs in it.
[workspace]
exclude = ["wall"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The evaluator itself. The view renders the same `Report` the command prints,
# so a drift between what CI gates on and what the wall shows is not a bug that
# can be introduced — there is nothing to keep in step.
arborist = { path = ".." }
arborist-wall = { path = "wall" }
# The wasip2 host is the one that renders offscreen; the browser host must not
# inherit that, so `headless` is asked for here and not in the wall.
gpui = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui", default-features = false, features = ["headless"] }
anyhow = "1"
gpui_wgpu = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui_wgpu", features = ["headless"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
wgpu-wasi-webgpu = { git = "https://github.com/fungOS-linux/wgpu-wasi-webgpu", rev = "bec921356c366450408d5faee2d206b6a1b8061b" }
wit-bindgen = "0.57"

[lints.rust]
# wit-bindgen emits unsafe shims and `export_name`; isolate that to the
# generated guest glue. The view on the other side of the ABI is safe Rust.
unsafe_code = "allow"
