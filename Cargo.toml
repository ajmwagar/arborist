[package]
name = "arborist"
description = "Fleet health: what every repository is missing, and what has rotted"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ajmwagar/arborist"
homepage = "https://github.com/ajmwagar/arborist"
publish = false

# A standalone workspace: the package builds its own wasm32-wasip2 component and
# nothing else in the fleet is involved.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The `arborist` command is the shipped face of this package: a `wasi:cli`
# component that reads a snapshot on stdin and answers with a report. The
# library half is the evaluator, and it is what a view or a test calls.
default = []
cli = []

[[bin]]
name = "arborist"
path = "src/bin/arborist.rs"
required-features = ["cli"]

[dependencies]
# The snapshot and the report are documents; neither side parses TOML.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
